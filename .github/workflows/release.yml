name: Build/release Marktext

on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-mdsakalu.*

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.21.1

      - name: Sync package.json version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="${VERSION}"
          echo "Set package.json version to ${VERSION}"

      - name: Install Linux Build Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

        # --ignore-scripts first to prevent postinstall scripts from running (we will run electron-rebuild manually later)
        # --no-audit and --no-fund to reduce noise
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts --loglevel verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Electron seems to require C++20 support for native modules now after Electron 33
      - name: Set C++20 for MacOS
        if: matrix.os == 'macos-latest'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      - name: Rebuild native modules for Electron (MacOS + Windows)
        if: matrix.os != 'ubuntu-22.04'
        run: npx @electron/rebuild -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Enforce using gcc/g++ on Linux for electron-rebuild instead of clang (.npmrc covers some settings too)
      - name: Rebuild native modules for Electron (Ubuntu)
        if: matrix.os == 'ubuntu-22.04'
        run: USE_ELECTRON_CLANG=0 npx @electron/rebuild -f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build-linux
        if: matrix.os == 'ubuntu-22.04'
        run: npm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mac builds have been disabled due to a lack of a Developer ID to sign it
      # All builds by default will give a "this app is damaged and can't be opened" error
      - name: build-mac
        if: matrix.os == 'macos-latest'
        run: npm run build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts for homebrew
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-zips
          path: |
            dist/marktext-mac-arm64-*.zip
            dist/marktext-mac-x64-*.zip
          retention-days: 1

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: npm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          name: 'Release ${{ github.ref_name }}'
          body: |
            ## ⚠️ Note for MacOS Users
            - MacOS releases will show a "`MarkText is damaged and can't be opened`" due to a **lack of notorisation**.
            - Please see [this fix here](https://github.com/marktext/marktext/issues/3004#issuecomment-1038207300) (which also applies to any other app that lacks a Developer Account signing)

            ## Changes
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    if: github.repository == 'mdsakalu/marktext'
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-zips
          path: dist

      - name: Calculate SHA256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM64_SHA=$(sha256sum dist/marktext-mac-arm64-${VERSION}.zip | cut -d' ' -f1)
          X64_SHA=$(sha256sum dist/marktext-mac-x64-${VERSION}.zip | cut -d' ' -f1)

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "ARM64_SHA=${ARM64_SHA}" >> $GITHUB_ENV
          echo "X64_SHA=${X64_SHA}" >> $GITHUB_ENV

      - name: Checkout homebrew-tap
        uses: actions/checkout@v3
        with:
          repository: mdsakalu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask formula
        run: |
          cat > homebrew-tap/Casks/marktext.rb << EOF
          cask "marktext" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM64_SHA}"
              url "https://github.com/mdsakalu/marktext/releases/download/v#{version}/marktext-mac-arm64-#{version}.zip",
                  verified: "github.com/mdsakalu/marktext/"
            end
            on_intel do
              sha256 "${X64_SHA}"
              url "https://github.com/mdsakalu/marktext/releases/download/v#{version}/marktext-mac-x64-#{version}.zip",
                  verified: "github.com/mdsakalu/marktext/"
            end

            name "MarkText"
            desc "Simple and elegant markdown editor (mdsakalu fork)"
            homepage "https://github.com/mdsakalu/marktext"

            auto_updates true
            depends_on macos: ">= :monterey"

            app "marktext.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/marktext.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/marktext",
              "~/Library/Preferences/com.electron.marktext.plist",
              "~/Library/Saved Application State/com.electron.marktext.savedState",
            ]

            caveats <<~EOS
              MarkText is not notarized by Apple, but quarantine has been removed automatically.
              The app should launch without any Gatekeeper warnings.
            EOS
          end
          EOF
          # Remove leading indentation from the generated file
          sed -i 's/^          //' homebrew-tap/Casks/marktext.rb

      - name: Commit and push to homebrew-tap
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/marktext.rb
          git commit -m "Update marktext to v${VERSION}"
          git push
